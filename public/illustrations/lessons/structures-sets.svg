<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="sets-title sets-desc">
  <title id="sets-title">Sets: what stays in the survey</title>
  <desc id="sets-desc">A notebook preserves beacon observations beside a dismantled beacon and an upright replacement. The two beacons carry different identity tags.</desc>
  <defs>
    <pattern id="sets-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <path d="M0 0V8" stroke="#78909a" stroke-width="1"/>
    </pattern>
    <g id="sets-beacon" stroke="#264653" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-32 150L-44 158V170Q0 185 44 170V158L32 150Z" fill="#f0f5f6" stroke-width="2.6"/>
      <ellipse cx="0" cy="156" rx="39" ry="11" fill="white" stroke-width="2.6"/>
      <path d="M-25 35H25V151Q0 162-25 151Z" fill="white" stroke-width="2.6"/>
      <path d="M12 42H25V151L12 155Z" fill="url(#sets-hatch)"/>
      <path d="M-32 28Q0 14 32 28L27 88Q0 99-27 88Z" fill="white" stroke-width="2.6"/>
      <path d="M-32 28V38Q0 51 32 38M-27 78Q0 90 27 78M-15 45L-13 83M15 45L13 83" fill="none" stroke-width="1.6"/>
      <path d="M-37 27L-25 12Q0-1 25 12L37 27Q0 43-37 27Z" fill="#f0f5f6" stroke-width="2.6"/>
      <path d="M-8 9V1Q0-7 8 1V9" fill="none" stroke-width="2.2"/>
    </g>
  </defs>
  <style>
