  <title id="lamport-title">Lamport clocks: local event counters</title>
  <desc id="lamport-desc">Two desks each hold a mechanical event counter with one blank rectangular readout. A report envelope with a matching counter-stamp box rests beside the receiving counter's adjustment knob. No wall-clock faces or values are shown.</desc>
