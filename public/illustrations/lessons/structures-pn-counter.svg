<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="pn-counter-title pn-counter-desc">
  <title id="pn-counter-title">PN-counter: keep the sightings and the corrections</title>
  <desc id="pn-counter-desc">A large open notebook keeps sightings on one page and corrections on the other. Two matching bird sketches on separate slips identify a repeated observation; neither notebook page is erased.</desc>
  <defs>
    <pattern id="pn-counter-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <path d="M0 0V8" stroke="#78909a" stroke-width="1"/>
    </pattern>
    <g id="pn-counter-bird" fill="white" stroke="#264653" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 42C17 36 12 23 27 19C33 5 50 8 52 21L66 25L52 29C50 45 40 53 26 47L8 60L17 43Z"/>
      <path d="M20 32Q38 24 41 35Q35 44 24 42M28 49L25 60M38 48L41 59M20 60H30M37 60H46" fill="none"/>
      <circle cx="43" cy="20" r="1.8" fill="#264653" stroke="none"/>
    </g>
  </defs>
  <style>
    .ink{fill:none;stroke:#264653;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fff;stroke:#264653;stroke-width:2.6;stroke-linejoin:round}
    .fine{fill:none;stroke:#78909a;stroke-width:1.5;stroke-linecap:round}
    .light{fill:#f0f5f6;stroke:#264653;stroke-width:2.2;stroke-linejoin:round}
  </style>
  <path class="fine" d="M121 468Q357 495 556 480M602 480L790 454"/>
  <g transform="rotate(-5 420 353)">
