    <path class="ink" d="M421 242L423 494"/>
    <path class="fine" d="M179 440Q300 440 406 474M441 474Q548 440 656 442"/>
    <path class="ink" d="M209 241V263M198 252H220M470 251H491"/>
    <path class="fine" d="M196 279Q293 281 395 310M456 305Q551 277 650 274"/>
    <use href="#pn-counter-bird" transform="translate(249 298) scale(1.1)"/>
    <path class="fine" d="M193 395Q280 393 389 423M191 413Q285 413 390 443"/>
    <circle class="ink" cx="205" cy="369" r="6"/>
    <path class="ink" d="M230 370L270 374M290 378L350 391"/>
    <circle class="ink" cx="469" cy="369" r="6"/>
    <path class="ink" d="M493 364L532 355"/>
