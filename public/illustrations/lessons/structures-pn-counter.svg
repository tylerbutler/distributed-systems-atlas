    <path d="M404 240L416 244L417 304L410 296L402 299Z" fill="#ebcd42" stroke="#264653" stroke-width="1.5"/>
  </g>
  <g transform="translate(507 120) rotate(9)">
    <path class="light" d="M11 11H125V150H11Z"/>
    <path class="paper" d="M0 0H114V139H0Z"/>
    <use href="#pn-counter-bird" transform="translate(22 37) scale(.9)"/>
    <path class="fine" d="M17 111H93M17 121H74"/>
    <path class="ink" d="M42 10V-7Q42-20 54-20Q67-20 67-7V21Q67 30 60 30Q52 30 52 21V-5"/>
