<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="transforms-title transforms-desc">
  <title id="transforms-title">Transforms: align edits with the report</title>
  <desc id="transforms-desc">An editing folio contains a structured form and a separate writing page. Narrow correction slips align with form fields, while a bold heading strip and an insertion marker remain separate edits on the writing page.</desc>
