  <title id="shared-map-title">SharedMap: update one record from the log</title>
  <desc id="shared-map-desc">An ordered station log and mechanical stamp sit beside a three-pocket field sheet. A stamped closed-gate report is selected in one pocket, an older open-gate slip lies aside, and the other records remain in place.</desc>
