<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="atlas-mv-title atlas-mv-desc">
  <title id="atlas-mv-title">Multi-value registers: two signal reports</title>
  <desc id="atlas-mv-desc">Two separately sealed signal-lens reports remain equally visible in one open-front holder. Different hatching distinguishes the lens drawings. A blank decision slip lies below, not yet replacing either report.</desc>
  <defs>
    <pattern id="atlas-mv-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><path d="M0 0V8" stroke="#78909a" stroke-width="1"/></pattern>
    <pattern id="atlas-mv-cross" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 0L9 9M9 0L0 9" stroke="#78909a" stroke-width="1"/></pattern>
    <g id="atlas-mv-lens"><path class="light" d="M-46 9Q0-12 46 9V69Q0 90-46 69Z"/><ellipse class="paper" cx="0" cy="39" rx="36" ry="43"/><path class="ink" d="M-15 81V96H15V81M-28 96H28"/></g>
  </defs>
  <style>
    .ink{fill:none;stroke:#264653;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fff;stroke:#264653;stroke-width:2.6;stroke-linejoin:round}
    .fine{fill:none;stroke:#78909a;stroke-width:1.5;stroke-linecap:round}
    .light{fill:#f0f5f6;stroke:#264653;stroke-width:2.2;stroke-linejoin:round}
  </style>
