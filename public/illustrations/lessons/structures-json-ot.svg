<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="json-ot-title json-ot-desc">
  <title id="json-ot-title">JsonOt: edits to separate fields</title>
  <desc id="json-ot-desc">An unlettered field-report form has a wide title field and a separate small revision field. A circle-marked wide edit and a diamond-marked short edit fit their own fields without overlap.</desc>
