  <title id="ordered-collection-title">OrderedCollection: one acquired job</title>
  <desc id="ordered-collection-desc">A single bridge-inspection card rests on a circle-marked field notebook outside an empty work tray. Diamond- and hexagon-marked notebooks have no acquired card. The card has no completion mark.</desc>
