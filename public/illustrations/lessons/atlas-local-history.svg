  <title id="local-history-title">Local history: a copy made before the next entry</title>
  <desc id="local-history-desc">Two separate observation desks hold local notebooks. A folded earlier report protrudes from an envelope between them. A fresh yellow-tabbed page remains at the sender's desk and is absent from the envelope and receiving notebook.</desc>
