  <title id="or-set-title">Observed-remove set: a replacement has its own identity</title>
  <desc id="or-set-desc">A retired beacon lies beside its retained rounded identity tag. An upright replacement carries a diamond-shaped tag. The notebook keeps the old retirement evidence and a separate new report.</desc>
