<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="counters-title counters-desc">
  <title id="counters-title">Counters: three ways to keep a field record</title>
  <desc id="counters-desc">An open notebook, a paired-page ledger, and a curled sequence log sit on a field table with binoculars. These are alternative ways to record bird counts.</desc>
