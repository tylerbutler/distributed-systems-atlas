<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="mv-register-title mv-register-desc">
  <title id="mv-register-title">MvRegister: keep both reports</title>
  <desc id="mv-register-desc">An open notebook holds equally sized open-gate and closed-gate reports under one clip. Circle and diamond marks identify their writers. A pencil and a blank resolution slip lie separately beside the notebook.</desc>
