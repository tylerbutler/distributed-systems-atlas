    <path d="M260 201H412M432 201H561M260 225H360" fill="none" stroke="#264653" stroke-width="7" stroke-linecap="square"/>
    <path class="ink" d="M260 278H590M260 310H582M260 342H598M260 374H561M260 410H510"/>
    <path class="fine" d="M260 286H590M260 318H582M260 350H598M260 382H561M260 418H510"/>
