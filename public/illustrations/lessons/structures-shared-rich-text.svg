<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="rich-text-title rich-text-desc">
  <title id="rich-text-title">SharedRichText: formatting and insertion</title>
  <desc id="rich-text-desc">A broad pen rests at a report heading drawn as heavy abstract strokes. A second pencil points to a newly appended triangular trail marker at the end of the final writing strip. The rest of the page remains intact.</desc>
  <defs><pattern id="rich-text-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><path d="M0 0V8" stroke="#78909a" stroke-width="1"/></pattern></defs>
  <style>
    .ink{fill:none;stroke:#264653;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fff;stroke:#264653;stroke-width:2.6;stroke-linejoin:round}
    .fine{fill:none;stroke:#78909a;stroke-width:1.5;stroke-linecap:round}
    .light{fill:#f0f5f6;stroke:#264653;stroke-width:2.2;stroke-linejoin:round}
  </style>
  <path class="fine" d="M117 465L689 516L804 461"/>
  <g transform="rotate(-7 430 320)">
