<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="registers-title registers-desc">
  <title id="registers-title">Registers: three ways to keep a report</title>
  <desc id="registers-desc">An empty trail-status board stands above three separate report holders: one selected gate report, two competing reports under one clip, and an archive with two reading tabs.</desc>
  <defs>
    <pattern id="registers-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><path d="M0 0V8" stroke="#78909a" stroke-width="1"/></pattern>
    <g id="registers-gate" fill="none" stroke="#264653" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M0 42V0H7V42M65 42V0H72V42M7 7H65V31H7ZM8 8L64 30M8 30L64 8"/></g>
    <g id="registers-open" fill="none" stroke="#264653" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M0 42V0H7V42M65 42V0H72V42M7 7L29-6V18L7 31M8 9L28 17"/></g>
  </defs>
  <style>
    .ink{fill:none;stroke:#264653;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:#fff;stroke:#264653;stroke-width:2.6;stroke-linejoin:round}
    .fine{fill:none;stroke:#78909a;stroke-width:1.5;stroke-linecap:round}
    .light{fill:#f0f5f6;stroke:#264653;stroke-width:2.2;stroke-linejoin:round}
  </style>
