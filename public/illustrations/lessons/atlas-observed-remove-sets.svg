<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="atlas-or-title atlas-or-desc">
  <title id="atlas-or-title">Observed-remove sets: check a delayed report</title>
  <desc id="atlas-or-desc">An opened delayed envelope contains an old beacon report with a rounded tag. The same tag is retained in a retirement-record pocket. A separate upright-beacon report has a diamond tag and remains intact.</desc>
