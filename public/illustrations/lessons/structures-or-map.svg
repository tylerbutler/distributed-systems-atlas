<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="or-map-title or-map-desc">
  <title id="or-map-title">OR-map: a concurrent delivery keeps the record</title>
  <desc id="or-map-desc">An open stockpile ledger retains tally marks and an old rounded identity slip in a pocket. Beside a loaded handcart, a new delivery report has a distinct diamond tag. The existing tally and physical crates remain intact.</desc>
