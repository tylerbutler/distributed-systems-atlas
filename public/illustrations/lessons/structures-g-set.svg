<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="g-set-title g-set-desc">
  <title id="g-set-title">GSet: keep every distinct observation</title>
  <desc id="g-set-desc">A trail beacon stands beside an open survey notebook containing three different beacon sketches. A loose report repeats an existing sketch without adding a second copy to the notebook.</desc>
  <defs>
    <pattern id="g-set-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <path d="M0 0V8" stroke="#78909a" stroke-width="1"/>
    </pattern>
    <g id="g-set-beacon" stroke="#264653" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-32 150L-44 158V170Q0 185 44 170V158L32 150Z" fill="#f0f5f6" stroke-width="2.6"/>
      <ellipse cx="0" cy="156" rx="39" ry="11" fill="white" stroke-width="2.6"/>
      <path d="M-25 35H25V151Q0 162-25 151Z" fill="white" stroke-width="2.6"/>
      <path d="M12 42H25V151L12 155Z" fill="url(#g-set-hatch)"/>
      <path d="M-32 28Q0 14 32 28L27 88Q0 99-27 88Z" fill="white" stroke-width="2.6"/>
      <path d="M-32 28V38Q0 51 32 38M-27 78Q0 90 27 78M-15 45L-13 83M15 45L13 83" fill="none" stroke-width="1.6"/>
      <path d="M-37 27L-25 12Q0-1 25 12L37 27Q0 43-37 27Z" fill="#f0f5f6" stroke-width="2.6"/>
      <path d="M-8 9V1Q0-7 8 1V9" fill="none" stroke-width="2.2"/>
    </g>
  </defs>
  <style>
