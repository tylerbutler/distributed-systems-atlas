<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="dots-title dots-desc">
  <title id="dots-title">Dots and causal context: identities and retained evidence</title>
  <desc id="dots-desc">A beacon report has a two-part seal with a circle writer mark and a blank event slot. An open notebook retains older identity slips in a pocket. A fresh diamond-sealed beacon report lies outside that notebook.</desc>
  <defs>
    <pattern id="dots-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><path d="M0 0V8" stroke="#78909a" stroke-width="1"/></pattern>
    <g id="dots-beacon" stroke="#264653" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-32 150L-44 158V170Q0 185 44 170V158L32 150Z" fill="#f0f5f6" stroke-width="2.6"/>
      <ellipse cx="0" cy="156" rx="39" ry="11" fill="white" stroke-width="2.6"/>
      <path d="M-25 35H25V151Q0 162-25 151Z" fill="white" stroke-width="2.6"/>
      <path d="M12 42H25V151L12 155Z" fill="url(#dots-hatch)"/>
      <path d="M-32 28Q0 14 32 28L27 88Q0 99-27 88Z" fill="white" stroke-width="2.6"/>
      <path d="M-32 28V38Q0 51 32 38M-27 78Q0 90 27 78M-15 45L-13 83M15 45L13 83" fill="none" stroke-width="1.6"/>
      <path d="M-37 27L-25 12Q0-1 25 12L37 27Q0 43-37 27Z" fill="#f0f5f6" stroke-width="2.6"/>
      <path d="M-8 9V1Q0-7 8 1V9" fill="none" stroke-width="2.2"/>
    </g>
  </defs>
  <style>
