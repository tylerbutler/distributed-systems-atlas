<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="directory-title directory-desc">
  <title id="directory-title">SharedDirectory: the same path, a new identity</title>
  <desc id="directory-desc">A fresh folder with a diamond seal sits inside a nested trail-file cabinet. A retired folder has the same tab shape but a round seal; a delayed note remains tied to that old seal outside the cabinet.</desc>
  <defs><pattern id="directory-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><path d="M0 0V8" stroke="#78909a" stroke-width="1"/></pattern></defs>
