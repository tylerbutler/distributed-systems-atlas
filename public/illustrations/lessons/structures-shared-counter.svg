<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="shared-counter-title shared-counter-desc">
  <title id="shared-counter-title">SharedCounter: the ranger's ordered log</title>
  <desc id="shared-counter-desc">Incoming envelopes sit beside a mechanical stamp. A continuous paper log keeps signed operations in separate rows with identity marks, and a clipped stack holds outgoing copies.</desc>
